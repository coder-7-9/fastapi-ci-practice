name: FastAPI Quality Gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 isort black mypy pytest

    - name: Run isort check
      run: isort --check-only --profile black .

    - name: Run black check
      run: black --check .

    - name: Run flake8 check
      run: flake8 . --max-line-length=88 --exclude=venv,.git,materials,practice,hw,migrations

    - name: Run mypy check
      run: mypy . --exclude "(venv|\.git|materials|practice|hw|migrations)"

    - name: Run tests
      run: pytest

